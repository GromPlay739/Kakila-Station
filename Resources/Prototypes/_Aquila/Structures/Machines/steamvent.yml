- type: entity
  id: Steamvent
  parent: BaseStructure
  name: nanotrasen banner
  description: A banner displaying the Nanotrasen logo. It looks rather cheap.
  suffix: Crook
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Aquila/Structures/Machines/steamvent.rsi
    state: icon
  - type: Transform
    noRot: true
  - type: Physics
    bodyType: Static
    fixedRotation: true
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/glass_break1.ogg
          params:
            volume: -6
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.5"
        hard: false
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
  - type: Slippery
    staminaDamage: 0
    frictionStatusTime: 0
    slipData:
      stunTime: 0
      knockdownTime: 0
      launchForwardsMultiplier: 0
    slipSound:
      path: /Audio/Effects/Footsteps/catwalk4.ogg
      params:
        variation: 0.125
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Aquila/Crook/steam_hiss.ogg
      params:
        volume: -5
        variation: 0.128
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition
  - type: UseDelay
    delay: 120
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    stepOn: true
  - type: TriggerOnStepTrigger
  - type: SmokeOnTrigger
    duration: 8
    spreadAmount: 5
