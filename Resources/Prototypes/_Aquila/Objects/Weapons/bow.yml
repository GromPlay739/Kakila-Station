- type: entity
  id: BaseChaplainContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedJobs: [ Chaplain ]

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowHoly
  name: energy arrow
  description: An arrow made from hardlight.
  components:
  - type: Sprite
    color: "#de9e41"
  - type: PointLight
    color: "#de9e41"
  - type: Projectile
    damage:
      types:
        Heat: 8
        Holy: 35
  - type: TimedDespawn
    lifetime: 5

- type: entity
  parent: [BaseHardlightArrow, BaseHardlightEmbeddableArrow]
  id: ArrowHeal
  name: energy arrow
  description: An arrow made from hardlight.
  components:
  - type: Sprite
    color: "#83db2b"
  - type: PointLight
    color: "#83db2b"
  - type: Projectile
    damage:
      groups:
        Brute: -22
        Burn: -22
  - type: TimedDespawn
    lifetime: 5
  - type: SpawnEntitiesOnHit
    spawnOnlyIfHitMob: false
    proto: EffectSpark

- type: selectableAmmo
  id: ArrowHeal
  desc: Disabler hardlight arrow. Deals no damage. Stuns in three hits.
  icon:
    sprite: _Goobstation/Wizard/Effects/effects.rsi
    state: sparks
  color: "#83db2b"
  protoId: ArrowHeal

- type: selectableAmmo
  id: ArrowHoly
  desc: Disabler hardlight arrow. Deals no damage. Stuns in three hits.
  icon:
    sprite: _Goobstation/Objects/Weapons/Guns/Bow/arrow.rsi
    state: arrow
  color: "#de9e41"
  protoId: ArrowHoly

- type: entity
  name: hardlight bow
  parent: [BaseItem, BaseChaplainContraband]
  id: BowHardlightChaplainDruid
  description: Being a Donk Co. design based on the DT-12 Lawbringer, this folding bow can generate a multitude of arrow types to fit the user's needs.
  components:
  - type: Sprite
    sprite: _Aquila/Objects/Weapons/Bow/hardlight_druid_bow.rsi
    layers:
    - state: bow-folded
      map: [ "base" ]
    - state: unwielded-arrow
      color: "#FFFFFF"
      visible: false
      shader: unshaded
      map: [ "bowstring" ]
  - type: Item
    heldPrefix: folded
    size: Normal
  - type: Clothing
    sprite: _Aquila/Objects/Weapons/Bow/hardlight_druid_bow.rsi
    quickEquip: false
    slots:
      - Back
      - suitStorage
  - type: Wieldable
    wieldSound:
      path: /Audio/Items/bow_pull.ogg
  - type: Nullrod
    DamageOnUntrainedUse:
      types:
        Heat: 20
    UntrainedUseString: nullrod-holyclaymore-untrained-usage-popup
  - type: UseDelay
    delay: 1
  - type: GunRequiresWield
  - type: Gun
    clumsyProof: true
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty: null
  - type: UnwieldOnShoot
  - type: UseDelayBlockShoot
  - type: BasicEntityAmmoProvider
    proto: ArrowHeal
  - type: AmmoSelector
    prototypes:
      - ArrowHoly
      - ArrowHeal
  - type: FoldingWeapon
  - type: UserInterface
    interfaces:
      enum.AmmoSelectorUiKey.Key:
        type: AmmoSelectorMenuBoundUserInterface
  - type: ActivatableUI
    altVerb: true
    verbOnly: true
    verbText: mode-select-verb-text
    key: enum.AmmoSelectorUiKey.Key
  - type: ItemToggle
    wieldToggle: false
    soundActivate:
      path: /Audio/Weapons/telescopicon.ogg
      params:
        volume: -5
    soundDeactivate:
      path: /Audio/Weapons/telescopicoff.ogg
      params:
        volume: -5
  - type: ItemToggleSize
    activatedSize: Huge
  - type: ItemTogglePointLight
    toggleableVisualsColorModulatesLights: true
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 0.6
  - type: PointLight
    enabled: false
    radius: 1.5
    energy: 1.5
    color: white
    netsync: false
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: bowstring
    inhandVisuals:
      left:
      - state: inhand-left-bowstring
        shader: unshaded
        map: [ "left" ]
      - state: wielded-inhand-left-bowstring
        shader: unshaded
        visible: false
        map: [ "wielded-left" ]
      right:
      - state: inhand-right-bowstring
        shader: unshaded
        map: [ "right" ]
      - state: wielded-inhand-right-bowstring
        shader: unshaded
        visible: false
        map: [ "wielded-right" ]
    clothingVisuals:
      back:
      - state: bowstring-equipped-BACKPACK
        shader: unshaded
      suitstorage:
      - state: bowstring-equipped-BACKPACK
        shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        bowstring:
          True: { state: wielded-arrow }
          False: { state: unwielded-arrow }
      enum.ToggleableVisuals.Enabled:
        bowstring:
          True: { visible: true }
          False: { visible: false }
        base:
          True: { state: bow }
          False: { state: bow-folded }
  - type: ToggleableLightWieldable
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 4 # Goobstation - Sniper rifles buff
    pvsIncrease: 0.4 # Goobstation - Sniper rifles buff
