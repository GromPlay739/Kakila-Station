- type: entity
  parent: ProduceSliceBase
  id: FoodPicklesSlice
  name: pickles wedge
  description: Small. Green. Salty.
  components:
  - type: FlavorProfile
    flavors:
      - salty
  - type: Sprite
    sprite: _Aquila/Objects/Consumables/Food/burger_sequence.rsi
    state: pickles
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Protein
          Quantity: 2
        - ReagentId: Vitamin
          Quantity: 2
  - type: Tag
    tags:
    - Slice
  - type: FoodSequenceElement
    entries:
      Burger: SlicePicklesBurger
  - type: Item
    size: Tiny

